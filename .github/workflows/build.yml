name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows is not a preference here: Interlude is a WPF package for Revit and Dynamo.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # The .NET 10 SDK compiles net8.0-windows as well, so one SDK covers the whole matrix.
          # The 8.0 runtime is not needed: the tests run on net10.0-windows and the 3.0/3.6
          # flavours are compile-verified from identical source.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Interlude.sln

      - name: Build the solution
        run: dotnet build Interlude.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test tests/Interlude.Tests/Interlude.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts/test-results

      - name: Build every Dynamo version and pack
        shell: pwsh
        run: ./scripts/build-all.ps1 -Configuration Release -Pack

      # The single most damaging regression this package can have is an unexpected DLL appearing
      # beside Interlude.dll in a folder Revit shares with every other add-in. build-all.ps1
      # already refuses to build one; this repeats the check against what was actually packed.
      #
      # Two files are allowed, not one. Interlude.customization.dll is how Dynamo requires node
      # icons to be delivered, and it is tolerable only for as long as it stays inert, so this
      # checks that too: no types, and nothing referenced beyond the netstandard facade.
      - name: Verify each package ships only the assemblies it should
        shell: pwsh
        run: |
          $expected = 'Interlude.dll', 'Interlude.customization.dll'
          $failed = $false

          foreach ($bin in Get-ChildItem dist -Recurse -Directory -Filter bin) {
            $dlls = @(Get-ChildItem $bin.FullName -Filter *.dll | Select-Object -ExpandProperty Name)
            $unexpected = @($dlls | Where-Object { $_ -notin $expected })
            $missing = @($expected | Where-Object { $_ -notin $dlls })

            if ($unexpected.Count -gt 0) {
              Write-Error "$($bin.FullName) contains unexpected assemblies: $($unexpected -join ', ')"
              $failed = $true
            }
            if ($missing.Count -gt 0) {
              Write-Error "$($bin.FullName) is missing: $($missing -join ', ')"
              $failed = $true
            }

            foreach ($required in 'Interlude.xml', 'Interlude_DynamoCustomization.xml') {
              if (-not (Test-Path (Join-Path $bin.FullName $required))) {
                Write-Error "$($bin.FullName) is missing $required"
                $failed = $true
              }
            }

            $icons = Join-Path $bin.FullName 'Interlude.customization.dll'
            if (Test-Path $icons) {
              $assembly = [System.Reflection.Assembly]::LoadFrom($icons)
              $types = @($assembly.GetTypes())
              $references = @($assembly.GetReferencedAssemblies() | Where-Object { $_.Name -ne 'netstandard' })

              if ($types.Count -gt 0) {
                Write-Error "$icons declares types ($(($types | Select-Object -ExpandProperty FullName) -join ', ')). It is allowed to ship only because it holds nothing but node icons."
                $failed = $true
              }
              if ($references.Count -gt 0) {
                Write-Error "$icons references $(($references | Select-Object -ExpandProperty Name) -join ', '). A resource assembly with dependencies is the regression this check exists to catch."
                $failed = $true
              }
            }
          }

          if ($failed) { exit 1 }
          Write-Host "Every package ships one code assembly and one inert resource assembly." -ForegroundColor Green

      - name: Verify the samples are up to date
        shell: pwsh
        run: |
          # The gallery in the preview harness is the source of truth for samples/. If they have
          # drifted, the checked-in examples no longer match the code that produced them.
          $exe = Get-ChildItem tools/Interlude.Preview/bin/Release -Recurse -Filter Interlude.Preview.exe |
            Select-Object -First 1
          & $exe.FullName --export samples
          $changed = git status --porcelain samples
          if ($changed) {
            Write-Error "samples/ is out of date. Run: Interlude.Preview.exe --export samples"
            Write-Host $changed
            exit 1
          }
          Write-Host "samples/ is up to date." -ForegroundColor Green

      - name: Verify the node help is up to date
        shell: pwsh
        run: |
          # docs/nodes/ is generated from the shipped assembly and its XML documentation. Help that
          # disagrees with the node it documents is worse than none, because the reader believes it.
          $exe = Get-ChildItem tools/Interlude.Preview/bin/Release -Recurse -Filter Interlude.Preview.exe |
            Select-Object -First 1
          & $exe.FullName --docs docs/nodes
          $changed = git status --porcelain docs/nodes
          if ($changed) {
            Write-Error "docs/nodes/ is out of date. Run: Interlude.Preview.exe --docs docs/nodes"
            Write-Host $changed
            exit 1
          }
          Write-Host "docs/nodes/ is up to date." -ForegroundColor Green

      - name: Verify the node icons are up to date
        shell: pwsh
        run: |
          # src/Interlude.Icons is generated from the catalogue in tools/Interlude.Preview/Icons.cs,
          # which the generator itself checks against the assembly in both directions. A node added
          # without an icon fails here rather than shipping with Dynamo's default cube.
          $exe = Get-ChildItem tools/Interlude.Preview/bin/Release -Recurse -Filter Interlude.Preview.exe |
            Select-Object -First 1
          & $exe.FullName --icons src/Interlude.Icons
          $changed = git status --porcelain src/Interlude.Icons
          if ($changed) {
            Write-Error "src/Interlude.Icons is out of date. Run: Interlude.Preview.exe --icons src/Interlude.Icons"
            Write-Host $changed
            exit 1
          }
          Write-Host "The node icons are up to date." -ForegroundColor Green

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interlude-packages
          path: dist/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/
          if-no-files-found: ignore
