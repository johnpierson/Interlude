site_name: Interlude
site_description: Really Great Forms for Dynamo. Describe a form with nodes, show it, get typed answers back.
site_author: John Pierson
site_url: https://johnpierson.github.io/Interlude/

repo_url: https://github.com/johnpierson/Interlude
repo_name: johnpierson/Interlude
edit_uri: edit/main/docs/

copyright: BSD 3-Clause licensed.

docs_dir: docs
site_dir: site

# See scripts/mkdocs_hooks.py. It rewrites the links that leave docs/ into absolute repository
# URLs, and expands the `folder/*` nav entry below. Both exist because docs/ is written to be read
# on GitHub first, and half of it is generated by the build.
hooks:
  - scripts/mkdocs_hooks.py

# The nav is derived from docs/README.md, which was already a hub page and is now also the
# homepage. Reference material that a reader looks *up* is separated from the guides they read
# *through*; docs/nodes/ — one generated file per node — expands automatically.
nav:
  - Home: README.md
  - Installing: installing.md
  - Guides:
      - Recipes: recipes.md
      - Coming from Data-Shapes: migrating-from-data-shapes.md
  - Sample graphs:
      - Overview: samples/index.md
      - A first form: samples/simple-form.md
  - Reference:
      - Node reference: node-reference.md
      - Forms as JSON: form-json.md
      - Node help: nodes/*
  - Architecture: architecture.md
  - History:
      - Original brief: original-brief.md

theme:
  name: material
  language: en
  # No Google Fonts request. The site is set in Space Grotesk, served from the same four static
  # faces that are compiled into Interlude.dll — see docs/stylesheets/extra.css and the font
  # copying in scripts/mkdocs_hooks.py.
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
  palette:
    # Light is ThemePalette.Neo and dark is ThemePalette.NeoDark — the two palettes of the
    # Neubrutalist preset, which is what ThemeDefinition.Default uses and therefore what a form
    # looks like when nobody themes it. Every value is in docs/stylesheets/extra.css.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

extra_css:
  - stylesheets/extra.css

extra:
  # Read by the hook when it rewrites a link into a repository URL.
  repo_branch: main
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/johnpierson/Interlude
      name: Interlude on GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  # Every heading anchor referenced from one of the contents lists is checked. node-reference.md
  # and recipes.md both open with one, and a stale entry there is the failure most worth catching.
  anchors: warn
